[package]
name = "kitten-tts"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Rust CLI for KittenTTS models with the native audio.cpp engine"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
hound = "3.5"
libloading = "0.9"
once_cell = "1.21"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
