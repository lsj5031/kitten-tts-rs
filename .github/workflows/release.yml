name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: kitten-tts
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: kitten-tts
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: kitten-tts.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Download and unpack ONNX Runtime + CUDA libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # Download ONNX Runtime GPU build
          curl -sLO https://github.com/microsoft/onnxruntime/releases/download/v1.23.0/onnxruntime-linux-x64-gpu-1.23.0.tgz
          tar -xzf onnxruntime-linux-x64-gpu-1.23.0.tgz
          cp -P onnxruntime-linux-x64-gpu-1.23.0/lib/libonnxruntime*.so* target/${{ matrix.target }}/release/
          cp -P onnxruntime-linux-x64-gpu-1.23.0/lib/libonnxruntime_providers_*.so target/${{ matrix.target }}/release/

          # Download CUDA 12.2 runtime libraries from NVIDIA runfile
          # Using runfile and extracting only the runtime libraries we need
          curl -sL https://developer.download.nvidia.com/compute/cuda/12.2.2/local_installers/cuda_12.2.2_535.104.05_linux.run -o cuda.run
          mkdir -p cuda-libs
          sh cuda.run --extract=cuda-libs --silent --override

          # Copy CUDA runtime libraries to release bundle
          # These are the libraries ONNX Runtime GPU needs
          cp -P cuda-libs/cuda/lib64/libcublasLt.so.12* target/${{ matrix.target }}/release/
          cp -P cuda-libs/cuda/lib64/libcublas.so.12* target/${{ matrix.target }}/release/
          cp -P cuda-libs/cuda/lib64/libcudart.so.12* target/${{ matrix.target }}/release/
          cp -P cuda-libs/cuda/lib64/libcufft.so.11* target/${{ matrix.target }}/release/
          cp -P cuda-libs/cuda/lib64/libcurand.so.11* target/${{ matrix.target }}/release/
          cp -P cuda-libs/cuda/lib64/libnvrtc.so.12* target/${{ matrix.target }}/release/

      - name: Download and unpack ONNX Runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LO https://github.com/microsoft/onnxruntime/releases/download/v1.23.0/onnxruntime-osx-arm64-1.23.0.tgz
          tar -xzf onnxruntime-osx-arm64-1.23.0.tgz
          cp -P onnxruntime-osx-arm64-1.23.0/lib/libonnxruntime*.dylib target/${{ matrix.target }}/release/

      - name: Download and unpack ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.23.0/onnxruntime-win-x64-gpu-1.23.0.zip" -OutFile "onnxruntime.zip"
          Expand-Archive -Path "onnxruntime.zip" -DestinationPath "onnxruntime"
          Copy-Item -Path "onnxruntime\onnxruntime-win-x64-gpu-1.23.0\lib\*.dll" -Destination "target/${{ matrix.target }}/release/"

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          archive="kitten-tts-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          cd target/${{ matrix.target }}/release
          tar -czf "../../../dist/${archive}" ${{ matrix.bin_name }} libonnxruntime* libcublasLt.so.12 libcublas.so.12 libcudart.so.12 libcufft.so.11 libcurand.so.10 libnvrtc.so.12

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          archive="kitten-tts-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          cd target/${{ matrix.target }}/release
          tar -czf "../../../dist/${archive}" ${{ matrix.bin_name }} libonnxruntime*.dylib

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "kitten-tts-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          $files = Get-ChildItem -Path "target/${{ matrix.target }}/release" -Include "${{ matrix.bin_name }}", "*.dll" -Recurse
          Compress-Archive -Path $files -DestinationPath "dist/$archive" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
